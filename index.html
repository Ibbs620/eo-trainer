<html>
    <head>
        <title>
            EO Trainer
        </title>
        <style>
            .eoList {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;         /* spacing between boxes */
            }
            .eoList > div {
                padding: 4px 8px;
                background: #eee;
                border-radius: 4px;
            }
            #settings  {
                border: 1px solid black;
                padding: 4px 8px;
                background: #eee;
                border-radius: 4px;
                width: fit-content;
            }
            
            #settings > input  {
                width: 25px;
            }

            p, div, h1, h2, h3, h4, span {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
        </style>
    </head>
    <body>
        <script src="EoFinder.js" type="module"></script>
        <script src="EoMatcher.js" type="module"></script>
        <script src="ScambleGenerator.js" type="module"></script>
        <script src="UI.js" type="module"></script>
        <script src="cube.js"></script>
        <script src="solve.js"></script>
        <script src="https://cdn.cubing.net/v0/js/cubing/twisty" type="module"></script>

        <h1>EO Trainer</h1>

        <div id="settings"> 
            <b>Settings</b> <br>   
            Time limit <input type="text" id="time-limit-m" maxlength="2" value="10"></input>m <input type="text" id="time-limit-s" maxlength="2" value="00">s <br> 
            Clear EO on entry<input type="checkbox" id="clear-eo">  <br> 
            Ignore inverse toggle when using brackets<input type="checkbox" id="ignore-inverse-toggle" checked="true"> <br> 
        </div>

        <h3 id="scramble-string"></h3>
        <twisty-player
            alg=""
            visualization="2D"
            hint-facelets="none"
            control-panel="none"
            background="none">
        </twisty-player>
        <button id="start-btn">Start</button>
        <button id="end-btn">End</button>

        <h2 id="timer" >Time Left: <span id="time-left">10:00</span></h2>
        <div id="eo-entry">
            <p>Enter EOs below</p>
            <textarea id="entered-eo"></textarea> 
            <p>Inverse: <input type="checkbox" id="inverse"></p>
            <h6 id="error-msg"></h6>
        </div>

        <div id="found-eos">
            <h4>Found: </h4>
            <div id="list-eos-found" class="eoList"></p>
        </div>

        <div id="report" style="visibility: hidden">
            <h4>Report</h4>
            <p>You found <span id="eos-found-num"></span> EOs!</p>
            <p>You missed <span id="missed-eos-num"></span> EOs:</p>
            <div id="missed-eos" class="eoList"></div>
        </div>
    </body>
</html>
