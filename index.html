<html>
    <head>
        <title>
            EO Trainer
        </title>
        <style>
            body {
                margin: 0;
                padding: 8px;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background-color: #1E1E2F;
                color: #E0E0E0;
            }
            #settings-box, #filter-box {
                width: fit-content;
                box-sizing: border-box;
                padding: 8px;
                background-color: #2C2C3E;
                border: 1px solid #555577;
                color: #E0E0E0;
            }

            #settings-box input[type="text"] {
                width: 3em;
            }

            #scramble-view {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
            }

            .eoList { 
                display: flex; 
                flex-wrap: wrap; 
                gap: 8px; 
            }

            #entered-eo {
                width: 200px;
                max-width: 100%;        
                height: 2.5em; 
                font-size: 1.1rem;
                box-sizing: border-box;
                resize : none;
            }

            #scramble-string {
                word-wrap: break-word;
                overflow-wrap: break-word;
                white-space: normal;                  
                max-width: 100%;      
            }

            .eoList > div {
                font-size: 1.2rem;
                border-radius: 4px;
                background-color: #2C2C3E;
                border: 1px solid #555577;
                color: #E0E0E0;
            }

            button {
                padding: 10px 16px;
                width: 100%;
                max-width: 300px;
                margin: 8px 0;
                background-color: #4C9AFF;
                color: #E0E0E0;
            }

            button:hover {
                background-color: #1A73FF;
            }

            input, textarea, select {
                background-color: #3C3C5E;
                color: #E0E0E0;
                border: 1px solid #555577;
            }

            #timer span {
                color: #FFCC00;
            }

            .active, .highlight {
                color: #FF6B6B;
            }

            @media (max-width: 480px) {
                h1, h2, h3 {
                    font-size: 1.2rem;
                }
                .eoList >div {
                    font-size: 0.9rem;
                }
                #entered-eo {
                    width: 100%;
                }
            }
        </style>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <script src="EoFormatter.js" type="module"></script>
        <script src="EoFinder.js" type="module"></script>
        <script src="EoMatcher.js" type="module"></script>
        <script src="ScambleGenerator.js" type="module"></script>
        <script src="UI.js" type="module"></script>
        <script src="cube.js"></script>
        <script src="solve.js"></script>
        <script src="https://cdn.cubing.net/v0/js/cubing/twisty" type="module"></script>

        <h1>EO Trainer</h1>

        <details id="settings-box" open="true"> 
            <summary>Settings</summary>
            <label>
                Time limit:
                <input type="text" id="time-limit-m" maxlength="2" value="10"></input>m <input type="text" id="time-limit-s" maxlength="2" value="00">s
            </label>
            <br>
            <label>
                Clear EO on entry:
                <input type="checkbox" id="clear-eo">
            </label>
            <br>
            <label>
                Ignore inverse toggle when using brackets:
                <input type="checkbox" id="ignore-inverse-toggle" checked="true">
            </label>
            <br>
            <label>
                Show inverse image:
                <input type="checkbox" id="toggle-inverse-image">
            </label>
            <br>
            <label>
                Scramble view:
                <select id="scramble-view-mode">
                    <option value="2d" selected>2D</option>
                    <option value="3d">3D</option>
                </select>
            </label>
        </details>

        <h3 id="scramble-string"></h3>
        <div id="scramble-view">
            <div id="normal-scramble">
                <span id="normal-scramble-title" style="visibility: hidden;">Normal</span>
                <twisty-player
                    id="normal-scramble-view"
                    alg=""
                    visualization="2D"
                    hint-facelets="none"
                    control-panel="none"
                    background="none">
                </twisty-player>
            </div>
            <div id="inverse-scramble" style="display: none">
                Inverse
                <twisty-player
                    id="inverse-scramble-view"
                    alg=""
                    visualization="2D"
                    hint-facelets="none"
                    control-panel="none"
                    background="none">
                </twisty-player>
            </div>
        </div>

        <h2 id="timer" >Time Left: <span id="time-left">10:00</span></h2>
        <button id="start-btn">Start</button>
        <button id="end-btn">End</button>
        <div id="eo-entry">
            <p>Enter EOs below</p>
            <textarea id="entered-eo"></textarea> 
            <p>Inverse: <input type="checkbox" id="inverse"></p>
            <span id="error-msg" style="color: red"></span>
        </div>

        <div id="found-eos">
            <h4>Found: </h4>
            <div id="list-eos-found" class="eoList"></p>
        </div>

        <div id="report" style="visibility: hidden">
            <h4>Report</h4>
            <p>You found <span id="eos-found-num"></span> EOs!</p>
            <p>You missed <span id="missed-eos-num"></span> EOs:</p>

            <details id="filter-box" open="false">
                <summary>Filter</summary>
                <label>
                    Max move count:
                    <input id="moves-slider" type="range" value="5" min="1" max="5" /> <span id="moves-slider-value">5</span>
                </label><br>
                <label>
                    Axis:
                    <label>
                        F/B
                        <input type="checkbox" id="axis-filter-fb" checked="true">
                    </label>
                    <label>
                        R/L
                        <input type="checkbox" id="axis-filter-rl" checked="true">
                    </label>
                    <label>
                        U/D
                        <input type="checkbox" id="axis-filter-ud" checked="true">
                    </label>
                </label><br>
                <label>
                    Show inverse EOs:
                    <input type="checkbox" id="inverse-filter" checked="true">
                </label><br>
                <label>
                    Show NISS EOs:
                    <input type="checkbox" id="niss-filter" checked="true">
                </label>
            </details>
            <br>
            <div id="missed-eos" class="eoList"></div>
        </div>
    </body>
</html>
